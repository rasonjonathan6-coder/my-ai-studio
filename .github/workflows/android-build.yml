name: android-build

# Dispatched by My AI Studio (POST /api/projects/:id/github/build). It builds a
# real debug APK on a GitHub-hosted runner and uploads it as an artifact. The
# workflow fails for real: if `./gradlew test` or `assembleDebug` fails, or if no
# APK is found afterwards, the job exits non-zero and no APK artifact is
# published. Nothing here reports success it did not achieve.
on:
  workflow_dispatch:
    inputs:
      subdir:
        description: Directory of the Gradle project, relative to the repository root
        required: false
        default: '.'
        type: string
      ref_label:
        description: Free-form label echoed into BUILD_INFO.txt (build id, project)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: test and assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ubuntu-latest ships the Android SDK and cmdline-tools preinstalled, so the
      # SDK is reused rather than downloaded again. ANDROID_SDK_ROOT points the
      # wrapper at it.
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Resolve project directory
        id: project
        run: |
          set -e
          sub="${{ github.event.inputs.subdir }}"
          [ -n "$sub" ] || sub='.'
          # The input selects a directory inside the checked-out workspace only.
          case "$sub" in
            /*|*..*) echo "invalid subdir: $sub"; exit 1 ;;
          esac
          if [ ! -d "$sub" ]; then
            echo "PROJECT DIRECTORY NOT FOUND: $sub"
            exit 1
          fi
          if [ ! -f "$sub/gradlew" ]; then
            echo "PROJECT HAS NO GRADLE WRAPPER: $sub/gradlew is missing"
            exit 1
          fi
          echo "dir=$sub" >> "$GITHUB_OUTPUT"

      - name: Ensure Android SDK is usable
        run: |
          set -e
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" || true
          # Only install when the platform the project needs is genuinely absent,
          # which avoids a slow sdkmanager run on every build.
          if [ ! -d "$ANDROID_SDK_ROOT/platforms/android-34" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Verify gradlew
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run unit tests
        id: tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          ./gradlew test --console=plain --no-daemon
          echo "result=passed" >> "$GITHUB_OUTPUT"

      - name: Assemble debug APK
        id: assemble
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          ./gradlew assembleDebug --console=plain --no-daemon
          echo "result=built" >> "$GITHUB_OUTPUT"

      - name: Locate the APK for real
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -e
          apk=$(find . -path '*/build/outputs/apk/debug/*.apk' -type f | sort | head -1)
          if [ -z "$apk" ]; then
            echo "BUILD FAILED: assembleDebug succeeded but no app-debug.apk was produced"
            exit 1
          fi
          # A zero-byte or non-archive file is not an APK.
          size=$(stat -c%s "$apk")
          if [ "$size" -le 0 ]; then
            echo "BUILD FAILED: $apk is empty"
            exit 1
          fi
          if ! head -c2 "$apk" | grep -q 'PK'; then
            echo "BUILD FAILED: $apk is not a zip archive"
            exit 1
          fi
          echo "path=$apk" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "APK FOUND: $apk ($size bytes)"

      - name: Package APK with build metadata
        run: |
          set -e
          mkdir -p apk-artifact
          apk="${{ steps.apk.outputs.path }}"
          cp "$apk" apk-artifact/app-debug.apk
          ( cd apk-artifact && sha256sum ./app-debug.apk > SHA256SUMS.txt )
          {
            echo "commit: ${{ github.sha }}"
            echo "branch: ${{ github.ref_name }}"
            echo "run_id: ${{ github.run_id }}"
            echo "run_number: ${{ github.run_number }}"
            echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "label: ${{ github.event.inputs.ref_label }}"
            echo "java: $(java -version 2>&1 | head -1)"
            echo "apk: app-debug.apk"
            echo "size_bytes: ${{ steps.apk.outputs.size }}"
            echo "sha256: ${{ steps.apk.outputs.sha256 }}"
          } > apk-artifact/BUILD_INFO.txt
          cat apk-artifact/BUILD_INFO.txt
          # The artifact must never carry a secret.
          if grep -rIlE 'sk-or-[A-Za-z0-9]|OPENROUTER_API_KEY|api_key=|apikey=|password=|private_key|secret=' apk-artifact; then
            echo "SECURITY FAILED: secret-like content in the APK artifact"
            exit 1
          fi
          echo "artifact secret scan: clean"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apk-artifact/
          retention-days: 14
          # Fails the job rather than publishing an empty artifact.
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            ${{ steps.project.outputs.dir }}/**/build/test-results/**
            ${{ steps.project.outputs.dir }}/**/build/reports/tests/**
          retention-days: 7
          if-no-files-found: ignore
