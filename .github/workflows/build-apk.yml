name: build-apk

on:
  push:
    branches: [main, master]
    paths:
      - 'android-samples/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    paths:
      - 'android-samples/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      sample:
        description: Android sample to build
        required: true
        default: all
        type: choice
        options: [all, hello, calculator, translator]

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build real debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: |
          set -e
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null || true
          echo "--- installed packages ---"
          sdkmanager --list_installed

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-samples/**/*.gradle*', 'android-samples/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Show toolchain versions
        run: |
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_SDK_ROOT/platforms" || true

      - name: Select samples to build
        id: pick
        run: |
          set -e
          want="${{ github.event.inputs.sample || 'all' }}"
          if [ "$want" = "all" ]; then
            echo "samples=$(for d in android-samples/*/; do [ -f "$d/gradlew" ] && basename "$d"; done | paste -sd' ' -)" >> "$GITHUB_OUTPUT"
          else
            echo "samples=$want" >> "$GITHUB_OUTPUT"
          fi

      - name: Run unit tests
        run: |
          # Each sample is a standalone Gradle project with its own wrapper;
          # android-samples/ itself has no settings.gradle.
          set -e
          for s in ${{ steps.pick.outputs.samples }}; do
            echo "=== test: $s ==="
            ./android-samples/$s/gradlew -p "android-samples/$s" test --console=plain --no-daemon
          done

      - name: Assemble debug APK
        run: |
          set -e
          for s in ${{ steps.pick.outputs.samples }}; do
            echo "=== assembleDebug: $s ==="
            ./android-samples/$s/gradlew -p "android-samples/$s" assembleDebug --console=plain --no-daemon
          done

      - name: Verify the APK file really exists
        run: |
          set -e
          found=0
          for apk in $(find android-samples -path '*/build/outputs/apk/debug/*.apk' -type f); do
            found=1
            echo "FOUND: $apk"
            ls -l "$apk"
            sha256sum "$apk"
          done
          if [ "$found" -eq 0 ]; then
            echo "BUILD FAILED: no APK was produced on disk"
            exit 1
          fi

      - name: Inspect APK with real Android tools
        run: |
          set -e
          AAPT=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort | tail -1)
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          mkdir -p apk-inspection
          for apk in $(find android-samples -path '*/build/outputs/apk/debug/*.apk' -type f); do
            base=$(basename "$apk")
            {
              echo "## $apk"
              echo "size: $(stat -c%s "$apk") bytes"
              echo "sha256: $(sha256sum "$apk" | awk '{print $1}')"
              echo "--- badging ---"
              "$AAPT" dump badging "$apk"
              echo "--- permissions ---"
              "$AAPT" dump permissions "$apk"
              echo "--- manifest ---"
              "$AAPT" dump xmltree "$apk" --file AndroidManifest.xml | head -n 120
              echo "--- signature ---"
              "$APKSIGNER" verify --print-certs --verbose "$apk"
            } > "apk-inspection/${base}.txt" 2>&1
            cat "apk-inspection/${base}.txt"
          done

      - name: Fail if the APK embeds secret material
        run: |
          set -e
          # Without this check a missing `unzip` would make the loop below find
          # nothing and report "clean" — a silent pass on a step whose whole job
          # is to catch leaks.
          command -v unzip > /dev/null || { echo "SECURITY FAILED: unzip is not available, cannot inspect the APK"; exit 1; }
          fail=0
          scanned=0
          for apk in $(find android-samples -path '*/build/outputs/apk/debug/*.apk' -type f); do
            tmp=$(mktemp -d)
            unzip -qq "$apk" -d "$tmp"
            scanned=$((scanned + 1))
            if grep -rIlE 'sk-or-[A-Za-z0-9]|OPENROUTER_API_KEY|api_key=|apikey=|password=|private_key|secret=' "$tmp" ; then
              echo "SECURITY FAILED: secret-like content found inside $apk"
              fail=1
            fi
            rm -rf "$tmp"
          done
          if [ "$scanned" -eq 0 ]; then
            echo "SECURITY FAILED: no APK was available to scan"
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "APK secret scan: clean ($scanned APK(s) inspected)"

      - name: Scan project sources for secrets
        run: |
          set -e
          if grep -rInE 'sk-or-[A-Za-z0-9_-]{10,}|OPENROUTER_API_KEY[[:space:]]*=[[:space:]]*[^"$[:space:]]{8,}' \
              --exclude-dir=.git --exclude-dir=build --exclude-dir=.gradle android-samples ; then
            echo "SECURITY FAILED: secret-like value committed in sources"
            exit 1
          fi
          echo "source secret scan: clean"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: android-samples/**/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload inspection reports
        uses: actions/upload-artifact@v4
        with:
          name: apk-inspection
          path: apk-inspection/
          retention-days: 14
          if-no-files-found: error
