name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        # Root install: this is an npm workspace, so frontend/ has no lockfile.
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Production build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
      - name: Assert the bundle contains no secret-looking values
        working-directory: frontend
        run: |
          set -e
          if grep -rIlE 'sk-or-[A-Za-z0-9]|OPENROUTER_API_KEY|DATABASE_URL|JWT_SECRET' dist/ ; then
            echo "FAILED: possible secret material found in the built bundle"
            exit 1
          fi
          echo "bundle secret scan: clean"
      - name: Upload frontend bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
          if-no-files-found: error

  backend-image:
    name: Backend (docker image)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          # Root context: the backend Dockerfile installs from the single root
          # lockfile (npm workspace), so ./backend alone would not build.
          context: .
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: my-ai-studio-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start container and probe health
        run: |
          set -e
          # The API needs a database to start. Start a throwaway PostgreSQL,
          # point the container at it, then assert the health endpoint responds.
          docker network create ci-net
          docker run -d --name ci-pg --network ci-net \
            -e POSTGRES_USER=myaistudio -e POSTGRES_PASSWORD=ci-password -e POSTGRES_DB=myaistudio \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec ci-pg pg_isready -U myaistudio > /dev/null 2>&1 && break
            sleep 1
          done
          docker run -d --name backend-ci --network ci-net -p 8080:8080 \
            -e NODE_ENV=production \
            -e JWT_SECRET=ci-container-secret-not-for-real-use \
            -e DATABASE_URL=postgres://myaistudio:ci-password@ci-pg:5432/myaistudio \
            my-ai-studio-backend:ci
          ok=0
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null; then ok=1; break; fi
            sleep 1
          done
          echo "--- /api/health ---"
          curl -s http://127.0.0.1:8080/api/health || true
          echo
          echo "--- container logs ---"
          docker logs backend-ci | tail -40
          docker rm -f backend-ci ci-pg || true
          docker network rm ci-net || true
          if [ "$ok" != "1" ]; then echo "FAILED: /api/health never became ready"; exit 1; fi

  docs-check:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Required documentation exists
        run: |
          set -e
          for f in README.md ARCHITECTURE.md SECURITY.md DEPLOYMENT.md SUPABASE_SETUP.md \
                   GITHUB_ACTIONS.md ORACLE_SETUP.md CLOUDFLARE_SETUP.md OPENROUTER_SETUP.md \
                   PRODUCTION_CHECKLIST.md TROUBLESHOOTING.md; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; exit 1; fi
          done
          echo "all required docs present"
      - name: .env files must not be committed
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.production$'; then
            echo "FAILED: a real .env file is tracked by git"
            exit 1
          fi
          echo "no tracked .env files"
