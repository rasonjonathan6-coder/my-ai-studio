name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: myaistudio
          POSTGRES_PASSWORD: myaistudio
          POSTGRES_DB: myaistudio_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U myaistudio"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://myaistudio:myaistudio@127.0.0.1:5432/myaistudio_test
      JWT_SECRET: ci-only-not-a-production-secret-value
      WORKSPACE_PATH: ${{ github.workspace }}/_ws
      STORAGE_PATH: ${{ github.workspace }}/_storage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Apply database migrations
        working-directory: backend
        run: npm run migrate

      - name: Verify schema was created
        working-directory: backend
        run: |
          node --input-type=module -e "
          import pg from 'pg';
          const c = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await c.connect();
          const r = await c.query(\"select table_name from information_schema.tables where table_schema='public' order by 1\");
          console.log(r.rows.map(x => x.table_name).join('\n'));
          const need = ['users','projects','conversations','messages','agent_runs','commands','builds','tests','artifacts','audit_logs'];
          const have = r.rows.map(x => x.table_name);
          const missing = need.filter(t => !have.includes(t));
          if (missing.length) { console.error('MISSING TABLES:', missing.join(',')); process.exit(1); }
          await c.end();
          "

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: API smoke test
        working-directory: backend
        run: |
          npm run dev & echo $! > /tmp/dev.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -s http://127.0.0.1:8080/api/health
          curl -s http://127.0.0.1:8080/api/system/status | head -c 400
          kill $(cat /tmp/dev.pid) || true

  # A separate job rather than steps in the backend job: the watchdog has no
  # relationship to the backend's dependencies, and it is also the one component
  # that must keep working when the backend does not. Sharing a job would let a
  # backend install failure hide a watchdog regression, which is the opposite of
  # what this is here to catch.
  watchdog:
    name: Watchdog (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No install step, deliberately. The watchdog depends on nothing outside
      # Node's own modules, and it has no lockfile, so `npm ci` would fail rather
      # than install anything. Add an install step here only once package.json
      # declares a dependency and a lockfile exists to go with it.
      - name: Run watchdog tests
        run: npm test --prefix watchdog
